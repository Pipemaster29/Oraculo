# Remede a calibração do Polymarket e commita o resultado.
#
# Uma vez por dia, não de hora em hora, e o motivo é aritmético: são ~2.100
# requisições de histórico de preço por execução, contra ~21 do painel. E o que
# ela mede muda devagar — um dia a mais de mercados resolvidos sobre uma amostra
# de dois mil move a terceira casa decimal do Brier.
#
# Os dois relógios diferentes são de propósito, e é o que permite ao painel ler
# a calibragem de `data/` em vez de recalculá-la a cada montagem.

# ---------------------------------------------------------------------------
# PAUSADO EM 15/09/2026, junto com o `painel`. Ver o cabeçalho de painel.yml:
# cada commit em `data/` dispara um build na Vercel, e a cota é de lá, não daqui.
# ---------------------------------------------------------------------------
# Este fluxo pesa MENOS que o outro em builds — três execuções em três dias,
# contra 21 do painel — mas ele também remonta o painel no passo seguinte, então
# religar só este continuaria publicando. Se for para voltar um, volte com
# frequência diária e olhe a cota antes de voltar o outro.

name: calibragem

on:
  # schedule:
  #   # 05:40 UTC: fora do minuto zero, onde a fila do GitHub é mais disputada.
  #   - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  group: dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calibrar:
    runs-on: ubuntu-latest
    # O teto é generoso porque 2.100 requisições com espera exponencial em cima
    # de 429 podem demorar bem mais que o caso bom. Morrer no teto perde a
    # execução inteira e não grava nada, que é melhor que gravar pela metade.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: medir a calibração
        run: python -m scripts.calibrar --teto 2100 --volume-minimo 20000

      - name: remontar o painel com a calibragem nova
        run: python -m scripts.montar --teto 2100

      - name: conferir as invariantes antes de commitar
        run: python -m scripts.auditar

      - name: commitar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "calibragem: medida em $(date -u +'%d/%m %H:%M UTC')"
          git push
